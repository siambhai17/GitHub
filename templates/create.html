{% extends "base.html" %}
{% block title %}Create Repository · GitHub Manager{% endblock %}

{% block content %}
<div class="welcome">
  <div>
    <h1>Create Repository</h1>
    <p>Spin up a new repository under your GitHub account.</p>
  </div>
</div>

<div class="card" style="max-width:720px">
  <div class="card-head">
    <div>
      <h2><span class="ico ico-plus"></span> New Repository</h2>
      <p class="sub">Fill in the details below.</p>
    </div>
  </div>

  <form method="post" action="{{ url_for('create_repo_route') }}">
    <div class="field">
      <label for="name">Repository Name</label>
      <input type="text" id="name" name="name" placeholder="e.g. my-project" required />
      <div class="help">Use letters, numbers, hyphens and underscores.</div>
    </div>

    <div class="field">
      <label>Visibility</label>
      <div class="radio-cards">
        <label class="radio-card">
          <input type="radio" name="private" value="off" checked />
          <span class="t"><span class="ico ico-globe"></span> Public</span>
          <span class="d">Anyone can see this repository.</span>
        </label>
        <label class="radio-card">
          <input type="radio" name="private" value="on" />
          <span class="t"><span class="ico ico-lock"></span> Private</span>
          <span class="d">Only you and collaborators can see it.</span>
        </label>
      </div>
    </div>

    <div class="field">
      <label for="description">Description <span class="text-muted">(optional)</span></label>
      <input type="text" id="description" name="description"
             placeholder="Short description of the repository" />
    </div>

    <div class="check-row">
      <input type="checkbox" id="auto_init" name="auto_init" checked />
      <label for="auto_init" style="margin:0">Initialize with a README</label>
    </div>

    <div class="flex flex-wrap">
      <button class="btn btn-green" type="submit">
        <span class="ico ico-plus"></span> Create Repository
      </button>
      <a class="btn btn-ghost" href="{{ url_for('dashboard') }}">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}

<script src="https://sites.super.myninja.ai/_assets/ninja-daytona-script.js"></script>
